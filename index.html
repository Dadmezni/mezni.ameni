<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>الأنشطة الإنتاجية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: one video-style stage (16:9 on wide screens, 4:5 on phones) with overlay controls, thumbnail strip below.
   Tokens: ink/teal page chrome, near-black stage so posters read like a screening. */
:root{
  --bg:#eef1f3; --fg:#13222c; --muted:#56666f; --line:#d3dade; --accent:#17685f; --accent-fg:#ffffff;
  --panel:#ffffff; --stage:#0c1318; --font:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1014; --fg:#e6edf0; --muted:#8fa0a8; --line:#222f37; --accent:#58c4b6; --accent-fg:#06201c; --panel:#121b21; --stage:#05090c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1014; --fg:#e6edf0; --muted:#8fa0a8; --line:#222f37; --accent:#58c4b6; --accent-fg:#06201c; --panel:#121b21; --stage:#05090c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-size:clamp(1.25rem,3.4vw,1.75rem);font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}

.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--stage);border-radius:10px;overflow:hidden;
  isolation:isolate;user-select:none;-webkit-user-select:none}
@media (max-width:640px){.stage{aspect-ratio:4/5}}
.stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none}
.slide.on{opacity:1;z-index:2;will-change:transform,opacity,clip-path}
.slide.out{opacity:1;z-index:1;will-change:transform,opacity}
.bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(28px) saturate(1.15);opacity:.55}
.fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:var(--o,50% 50%)}

/* Mouvement de caméra (Ken Burns) : zoom + léger travelling, en alternant avant / arrière */
.slide.on .fg,.slide.out .fg{animation:kb var(--d,6s) cubic-bezier(.3,.1,.3,1) forwards}
.slide.zo.on .fg,.slide.zo.out .fg{animation-name:kbo}
.stage.paused .slide.on .fg,.stage.paused .slide.out .fg{animation-play-state:paused}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(var(--z,1.1)) translate(var(--tx,0),var(--ty,0))}}
@keyframes kbo{from{transform:scale(var(--z,1.1)) translate(var(--tx,0),var(--ty,0))}to{transform:scale(1) translate(0,0)}}

/* Transitions entre diapositives : l'entrante et la sortante bougent ensemble */
.slide.on[data-tr]{animation-duration:var(--trd,1.15s);animation-timing-function:cubic-bezier(.65,0,.2,1);animation-fill-mode:backwards}
.slide.out[data-tr]{animation-duration:var(--trd,1.15s);animation-timing-function:cubic-bezier(.65,0,.2,1);animation-fill-mode:both}
/* zoom : fondu avec léger recul */
.slide.on[data-tr=zoom]{animation-name:inZoom}
.slide.out[data-tr=zoom]{animation-name:outZoom}
/* push : glissement latéral avec effet de parallaxe */
.slide.on[data-tr=push]{animation-name:inPush}
.slide.out[data-tr=push]{animation-name:outPush}
/* wipe : rideau qui révèle l'image suivante */
.slide.on[data-tr=wipe]{animation-name:inWipe}
.stage[data-dir="-1"] .slide.on[data-tr=wipe]{animation-name:inWipeR}
.slide.out[data-tr=wipe]{animation-name:outWipe}
/* rise : l'image monte depuis le bas */
.slide.on[data-tr=rise]{animation-name:inRise}
.slide.out[data-tr=rise]{animation-name:outRise}
@keyframes inZoom{from{opacity:0;transform:scale(1.12);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes outZoom{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94)}}
@keyframes inPush{from{transform:translateX(calc(var(--dir,1) * -100%))}to{transform:none}}
@keyframes outPush{from{opacity:1;transform:none}to{opacity:.3;transform:translateX(calc(var(--dir,1) * 32%))}}
@keyframes inWipe{from{clip-path:inset(0 100% 0 0);transform:scale(1.08)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes inWipeR{from{clip-path:inset(0 0 0 100%);transform:scale(1.08)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes outWipe{from{opacity:1;transform:none}to{opacity:.35;transform:scale(1.05)}}
@keyframes inRise{from{clip-path:inset(100% 0 0 0);transform:translateY(7%)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes outRise{from{opacity:1;transform:none}to{opacity:.35;transform:translateY(-9%)}}

/* Galerie : chaque photo arrive en douceur avec un léger zoom */
.gp{position:absolute;inset:0;opacity:0;transform:scale(1.05);transition:opacity .9s ease,transform 1.5s cubic-bezier(.2,.7,.2,1)}
.gp.on{opacity:1;transform:none}
.slide.gal .fg{animation:none}
.slide.gal .gp.on .fg{animation:kb var(--gd,4s) cubic-bezier(.3,.1,.3,1) forwards}
.slide.gal .gp.zo.on .fg{animation-name:kbo}
.slide.first{background:#c8cacc;container-type:size}
.scene{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(100cqw,calc(100cqh * 838 / 472));aspect-ratio:838/472}
.ly{position:absolute}
.ly img{display:block;width:100%;height:100%}
.slide.on .ly.tx,.slide.out .ly.tx{animation:txt .95s cubic-bezier(.2,.7,.2,1) var(--dl) both}
.slide.on .ly.ob,.slide.out .ly.ob{animation:var(--in) 1s cubic-bezier(.2,.9,.3,1.12) var(--dl) both, bob var(--bd,3.6s) ease-in-out calc(var(--dl) + 1s) infinite alternate}
.stage.rest .slide .ly{animation:none!important}
.stage.paused .slide.on .ly,.stage.paused .slide.out .ly{animation-play-state:paused}
@keyframes txt{from{opacity:0;clip-path:inset(0 0 0 100%);transform:translateY(12px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.35) rotate(-10deg)}60%{opacity:1;transform:scale(1.1) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-110px) rotate(-28deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes fromB{from{opacity:0;transform:translateY(130px) rotate(5deg)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(120px) rotate(16deg)}to{opacity:1;transform:none}}
@keyframes bob{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(var(--by,-6px)) rotate(var(--br,2deg))}}
@keyframes rmIn{from{opacity:0}to{opacity:1}}
@keyframes rmOut{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .slide.on[data-tr]{animation:rmIn .3s both}
  .slide.out[data-tr]{animation:rmOut .3s both}
  .slide.on .fg,.slide.out .fg{animation:none}.slide.on .ly,.slide.out .ly{animation:none!important}.slide.gal .gp.on .fg{animation:none}
  .gp{transform:none;transition:opacity .3s}
}


/* Finition : compteur, reflet lumineux lors des transitions */
.count{position:absolute;top:12px;inset-inline-start:14px;z-index:5;display:flex;align-items:baseline;gap:5px;direction:ltr;
  padding:5px 11px;border-radius:999px;background:rgba(5,9,12,.5);color:#fff;font-size:.8rem;font-variant-numeric:tabular-nums;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .3s;pointer-events:none}
.count b{font-weight:700;display:inline-block}
.count span{opacity:.7}
.count b.flip{animation:cnt .55s cubic-bezier(.2,.8,.2,1)}
@keyframes cnt{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
.stage.idle:not(.paused) .count{opacity:0}
.sweep{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%)}
.sweep.go{animation:sweep 1.2s cubic-bezier(.65,0,.2,1)}
@keyframes sweep{0%{opacity:0;transform:translateX(calc(var(--dir,1) * -100%))}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(calc(var(--dir,1) * 100%))}}

/* Diapositive finale : remerciement + logo */
.slide.outro{background:radial-gradient(ellipse at 50% 42%,#f4f6f7 0%,#dde1e4 55%,#c8cacc 100%);container-type:size}
.outro-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3cqh,26px);text-align:center;padding:0 5cqw}
.lg{position:relative;display:grid;place-items:center;width:min(28cqw,40cqh)}
.lg img{display:block;width:100%;height:auto;position:relative;z-index:1}
.lg::before,.lg::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:2px solid rgba(23,50,95,.35);opacity:0}
.thx{margin:0;font-weight:700;font-size:clamp(1.6rem,6.4cqw,4.2rem);line-height:1.3;color:#17325f;text-wrap:balance}
.rule{height:3px;width:0;border-radius:2px;background:linear-gradient(90deg,#17325f,#17685f)}
.slide.outro.on .lg img,.slide.outro.out .lg img{animation:popin 1s cubic-bezier(.2,.9,.3,1.12) .45s both,bob 3.8s ease-in-out 1.5s infinite alternate;--by:-6px;--br:0deg}
.slide.outro.on .lg::before,.slide.outro.out .lg::before{animation:ring 3.2s ease-out 1.2s infinite}
.slide.outro.on .lg::after,.slide.outro.out .lg::after{animation:ring 3.2s ease-out 2.8s infinite}
.slide.outro.on .rule,.slide.outro.out .rule{animation:ruleIn 1s cubic-bezier(.2,.7,.2,1) 1.3s both}
.slide.outro.on .thx,.slide.outro.out .thx{animation:txt 1.1s cubic-bezier(.2,.7,.2,1) 1.8s both}
@keyframes ring{0%{opacity:.55;transform:scale(.8)}100%{opacity:0;transform:scale(1.55)}}
@keyframes ruleIn{from{width:0}to{width:min(30cqw,280px)}}
.stage.paused .slide.outro .lg img,.stage.paused .slide.outro .lg::before,.stage.paused .slide.outro .lg::after,
.stage.paused .slide.outro .rule,.stage.paused .slide.outro .thx{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.sweep{display:none}.count b.flip{animation:none}
  .slide.outro .lg img,.slide.outro .lg::before,.slide.outro .lg::after,.slide.outro .rule,.slide.outro .thx{animation:none!important}
  .slide.outro .lg::before,.slide.outro .lg::after{display:none}.slide.outro .rule{width:min(30cqw,280px)}}

.ui{position:absolute;inset-inline:0;bottom:0;z-index:5;padding:28px 14px 10px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(to top,rgba(5,9,12,.82),rgba(5,9,12,0));color:#fff;transition:opacity .3s}
.stage.idle:not(.paused) .ui{opacity:0}
.segs{display:flex;gap:3px;direction:rtl}
.seg{flex:1;height:14px;padding:5px 0;background:none;border:0;cursor:pointer;position:relative}
.seg::before{content:"";position:absolute;inset-inline:0;top:5px;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
.seg i{position:absolute;inset-inline-start:0;top:5px;height:4px;border-radius:2px;background:#fff;width:0;display:block}
.seg:hover::before{background:rgba(255,255,255,.45)}
.bar{display:flex;align-items:center;gap:6px}
.sp{flex:1}
.btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.16)}
.btn svg{width:22px;height:22px;fill:currentColor}
.btn.main{background:#fff;color:#0c1318}
.btn.main:hover{background:#e3ecef}
.time{font-variant-numeric:tabular-nums;font-size:.85rem;opacity:.9;direction:ltr;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ui :focus-visible,.cover :focus-visible{outline-color:#fff}

.cover{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(5,9,12,.5);color:#fff;text-align:center;transition:opacity .3s}
.cover[hidden]{display:none!important}
.big{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 28px rgba(0,0,0,.4)}
.big svg{width:38px;height:38px;fill:currentColor}
.big:hover{filter:brightness(1.08)}
.cover b{font-size:1.15rem;font-weight:700}
.cover span{font-size:.9rem;opacity:.85}

.thumbs{display:flex;gap:8px;overflow-x:auto;padding-block:4px 8px;scroll-snap-type:x proximity;direction:rtl}
.th{transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;flex:0 0 auto;width:96px;height:68px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--panel);cursor:pointer;position:relative;scroll-snap-align:center}
.th img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72;transition:opacity .3s}
.th:hover img{opacity:1}
.th:hover{transform:translateY(-2px)}
.th[aria-current="true"]{border-color:var(--accent);transform:translateY(-3px) scale(1.04);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.th[aria-current="true"] img{opacity:1}
.th em{position:absolute;inset-inline-end:3px;bottom:3px;font-style:normal;font-size:.7rem;line-height:1;padding:2px 5px;border-radius:3px;background:rgba(5,9,12,.75);color:#fff;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.85rem;margin:0}
</style>

<div dir="rtl" lang="ar" class="wrap">
  <header>
    <h1>الأنشطة الإنتاجية</h1>
    <span class="sub">المرحلة الثانوية · العام الأكاديمي 2026–2027</span>
  </header>

  <div class="stage paused" id="stage" aria-label="عرض مرئي للأنشطة الإنتاجية">
    <div id="slides"></div>
    <div class="sweep" id="sweep" aria-hidden="true"></div>
    <div class="count" id="count" aria-hidden="true"><b id="cn">01</b><span id="ctot">/ 00</span></div>

    <div class="cover" id="cover">
      <button class="big" id="bigplay" type="button" aria-label="تشغيل العرض"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l11-6.8a1 1 0 0 0 0-1.8l-11-6.8A1 1 0 0 0 8 5.2z"/></svg></button>
      <b id="covt">تشغيل العرض</b>
      <span id="covs"></span>
    </div>

    <div class="ui" id="ui">
      <div class="segs" id="segs"></div>
      <div class="bar">
        <button class="btn main" id="pp" type="button" aria-label="تشغيل / إيقاف"><svg viewBox="0 0 24 24" id="ppi" aria-hidden="true"></svg></button>
        <button class="btn" id="prev" type="button" aria-label="الشريحة السابقة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7zM20 6.6v10.8a.8.8 0 0 1-1.2.7L10.6 12.7a.8.8 0 0 1 0-1.4l8.2-4.9a.8.8 0 0 1 1.2.7z" transform="translate(24 0) scale(-1 1)"/></svg></button>
        <button class="btn" id="next" type="button" aria-label="الشريحة التالية"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2zM4 6.6v10.8a.8.8 0 0 0 1.2.7l8.2-4.9a.8.8 0 0 0 0-1.4L5.2 5.9A.8.8 0 0 0 4 6.6z"/></svg></button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="sp"></span>
        <button class="btn" id="mute" type="button" aria-label="كتم الصوت" aria-pressed="false"><svg viewBox="0 0 24 24" id="mi" aria-hidden="true"></svg></button>
        <button class="btn" id="fs" type="button" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
      </div>
    </div>
  </div>

  <div class="thumbs" id="thumbs" role="list" aria-label="الشرائح"></div>
  <p class="hint">مسافة: تشغيل / إيقاف · الأسهم: التنقل بين الشرائح</p>
</div>

<script>
const SLIDES = [{"src": "img/s01.jpg", "d": 9, "k": "first"}, {"src": "img/cards.jpg", "d": 8, "k": "poster"}, {"src": "img/s02.jpg", "d": 8, "k": "doc"}, {"src": "img/s03.jpg", "d": 6, "k": "poster"}, {"src": "img/s04.jpg", "d": 6, "k": "poster"}, {"src": "img/s05.jpg", "d": 6, "k": "poster"}, {"src": "img/s06.jpg", "d": 6, "k": "poster"}, {"src": "img/s07.jpg", "d": 8, "k": "doc"}, {"src": "img/s08.jpg", "d": 6, "k": "poster"}, {"src": "img/s09.jpg", "d": 6, "k": "poster"}, {"src": "img/s10.jpg", "d": 8, "k": "doc"}, {"src": "img/s11.jpg", "d": 8, "k": "doc"}, {"src": "img/s12.jpg", "d": 8, "k": "doc"}, {"src": "img/s13.jpg", "d": 6, "k": "poster"}, {"src": "img/s14.jpg", "d": 8, "k": "doc"}, {"src": "img/s15.jpg", "d": 8, "k": "doc"}, {"src": "img/s16.jpg", "d": 6, "k": "poster"}, {"src": "img/s17.jpg", "d": 6, "k": "poster"}, {"src": "img/s18.jpg", "d": 8, "k": "doc"}, {"src": "img/s19.jpg", "d": 6, "k": "poster"}, {"src": "img/ga1.jpg", "d": 24.5, "k": "gallery", "items": ["img/ga1.jpg", "img/ga2.jpg", "img/ga3.jpg", "img/ga4.jpg", "img/gb1.jpg", "img/gb2.jpg", "img/gb3.jpg"]}, {"src": "img/cards.jpg", "d": 9, "k": "poster"}, {"src": "img/p1_logo.png", "d": 8, "k": "outro"}];
(function(){
  const $ = id => document.getElementById(id);
  const stage=$('stage'), host=$('slides'), segsEl=$('segs'), thumbs=$('thumbs'), cnEl=$('cn'), sweepEl=$('sweep');
  const total = SLIDES.reduce((a,s)=>a+s.d*1000,0);
  const fmt = ms => { const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  const PLAY='<path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l11-6.8a1 1 0 0 0 0-1.8l-11-6.8A1 1 0 0 0 8 5.2z"/>';
  const PAUSE='<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
  const SPK='<path d="M4 9.5v5h3.6l4.9 4V5.5l-4.9 4zM15.5 8.2a5 5 0 0 1 0 7.6l-1.3-1.5a3 3 0 0 0 0-4.6zM18 5.6a8.6 8.6 0 0 1 0 12.8l-1.4-1.5a6.6 6.6 0 0 0 0-9.8z"/>';
  const SPKX='<path d="M4 9.5v5h3.6l4.9 4V5.5l-4.9 4zM15 9.6l1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/>';
  const LAYERS=[
    {n:'logo',  x:24, y:15, w:134,h:110,t:'ob',in:'popin', dl:.15, by:'-5px',br:'0deg',bd:'4.2s'},
    {n:'t1',    x:259,y:62, w:496,h:53, t:'tx',dl:.9},
    {n:'t2',    x:347,y:135,w:318,h:53, t:'tx',dl:1.5},
    {n:'cap',e:'svg',x:58, y:160,w:189,h:164,t:'ob',in:'fromL', dl:.5,  by:'-10px',br:'-5deg',bd:'3.1s'},
    {n:'t3',    x:347,y:253,w:309,h:53, t:'tx',dl:2.2},
    {n:'t4',    x:272,y:306,w:456,h:65, t:'tx',dl:2.8},
    {n:'books',e:'svg',x:0,  y:296,w:244,h:176,t:'ob',in:'fromB', dl:.7,  by:'-8px', br:'-1.5deg',bd:'3.8s'},
    {n:'t5',    x:244,y:383,w:348,h:63, t:'tx',dl:3.5},
    {n:'hourglass',e:'svg',x:732,y:245,w:106,h:209,t:'ob',in:'fromR', dl:1.0, by:'-9px', br:'6deg',bd:'3.4s'}
  ];
  function buildScene(){
    const sc=document.createElement('div'); sc.className='scene';
    LAYERS.forEach(L=>{
      const d=document.createElement('div'); d.className='ly '+L.t;
      d.style.cssText='left:'+(L.x/838*100)+'%;top:'+(L.y/472*100)+'%;width:'+(L.w/838*100)+'%;height:'+(L.h/472*100)+'%';
      d.style.setProperty('--dl',L.dl+'s');
      if(L.in){ d.style.setProperty('--in',L.in); d.style.setProperty('--by',L.by); d.style.setProperty('--br',L.br); d.style.setProperty('--bd',L.bd); }
      const im=new Image(); im.alt=''; im.src='img/p1_'+L.n+'.'+(L.e||'png'); im.decoding='async'; d.appendChild(im); sc.appendChild(d);
    });
    return sc;
  }
  const ORIGINS=['50% 0%','50% 100%','50% 50%','0% 50%','100% 50%'];
  const PANS=[['-1.2%','.8%'],['1.2%','-.8%'],['0%','-1.2%'],['-.8%','-.6%'],['.8%','.8%'],['1%','0%']];
  const TR=['zoom','push','wipe','rise','zoom','push','rise','wipe'];

  const slideEls=[], segFills=[], thumbEls=[];
  const galEls={}; let galCur=-1;
  SLIDES.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='slide';
    el.style.setProperty('--d', s.d+'s');
    el.style.setProperty('--o', s.k==='first'?'50% 50%':ORIGINS[i%ORIGINS.length]);
    el.style.setProperty('--z', s.k==='first'?'1.05':(s.k==='doc'?'1.08':'1.12'));
    el.style.setProperty('--tx',PANS[i%PANS.length][0]); el.style.setProperty('--ty',PANS[i%PANS.length][1]);
    if(s.k!=='first' && i%3===1) el.classList.add('zo');
    if(s.k==='first'){
      el.classList.add('first'); el.setAttribute('role','img'); el.setAttribute('aria-label','الصفحة الأولى: مدرسة الشرق الأوسط الدولية، المرحلة الثانوية، قيمة الإبحار الآمن، الأنشطة الإنتاجية');
      el.appendChild(buildScene());
    } else if(s.k==='outro'){
      el.classList.add('outro'); el.setAttribute('role','img'); el.setAttribute('aria-label','شكرا على المتابعة - قسم المواد الإلزامية، مدرسة الشرق الأوسط الدولية');
      const w=document.createElement('div'); w.className='outro-wrap';
      const lg=document.createElement('div'); lg.className='lg';
      const lim=new Image(); lim.alt=''; lim.src=s.src; lim.decoding='async'; lg.appendChild(lim);
      const rl=document.createElement('div'); rl.className='rule';
      const h=document.createElement('h2'); h.className='thx'; h.textContent='شكرا على المتابعة';
      w.append(lg,rl,h); el.appendChild(w);
    } else if(s.k==='gallery'){
      el.classList.add('gal'); el.style.setProperty('--gd',(s.d/s.items.length+.8)+'s'); el.style.setProperty('--z','1.08'); el.style.setProperty('--o','50% 40%');
      s.items.forEach((u,j)=>{
        const g=document.createElement('div'); g.className='gp'+(j%2?' zo':'');
        g.style.setProperty('--tx',PANS[(j+2)%PANS.length][0]); g.style.setProperty('--ty',PANS[(j+2)%PANS.length][1]);
        const bg=new Image(); bg.className='bg'; bg.alt=''; bg.src=u; bg.decoding='async';
        const fg=new Image(); fg.className='fg'; fg.alt='صورة الطلاب '+(j+1); fg.src=u; fg.decoding='async';
        g.append(bg,fg); el.appendChild(g);
      });
      galEls[i]=Array.from(el.querySelectorAll('.gp'));
    } else {
      const bg=new Image(); bg.className='bg'; bg.alt=''; bg.src=s.src; bg.decoding='async';
      const fg=new Image(); fg.className='fg'; fg.alt='الشريحة '+(i+1); fg.src=s.src; fg.decoding='async';
      el.append(bg,fg);
    }
    host.appendChild(el); slideEls.push(el);

    const sg=document.createElement('button'); sg.type='button'; sg.className='seg'; sg.setAttribute('aria-label','الانتقال إلى الشريحة '+(i+1));
    const f=document.createElement('i'); sg.appendChild(f); sg.style.flex=String(s.d); sg.onclick=()=>go(i); segsEl.appendChild(sg); segFills.push(f);

    const th=document.createElement('button'); th.type='button'; th.className='th'; th.setAttribute('role','listitem'); th.setAttribute('aria-label','الشريحة '+(i+1));
    const im=new Image(); im.alt=''; im.loading='lazy'; im.src=s.src; if(s.k==='outro'){ im.style.objectFit='contain'; im.style.padding='4px'; im.style.background='#e6e9eb'; im.style.opacity='1'; } const n=document.createElement('em'); n.textContent=i+1;
    th.append(im,n); th.onclick=()=>go(i); thumbs.appendChild(th); thumbEls.push(th);
  });

  const BASEVOL=.45;
  const audio=new Audio(); audio.preload='auto'; audio.volume=BASEVOL; audio.loop=true;
  let audioReady=false;
  fetch('music.mp3').then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(b=>{ audio.src=URL.createObjectURL(b); }).catch(()=>{ audio.src='music.mp3'; });
  audio.addEventListener('canplay',()=>{ audioReady=true; if(playing&&audio.paused){ syncAudio(); audioPlay(); } });
  function elapsed(){ let b=0; for(let k=0;k<idx;k++) b+=SLIDES[k].d*1000; return b+t; }
  function wantPos(){ const d=audio.duration, p=elapsed()/1000; return (d&&isFinite(d))?p%d:p; }
  function syncAudio(){ try{ audio.currentTime=wantPos(); }catch(e){} }
  function audioPlay(){ try{ const p=audio.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
  let rest=true; stage.classList.add('rest');
  let muted=false;
  function setMute(){ audio.muted=muted; $('mi').innerHTML=muted?SPKX:SPK; $('mute').setAttribute('aria-pressed',String(muted)); $('mute').setAttribute('aria-label',muted?'تشغيل الصوت':'كتم الصوت'); }
  $('mute').onclick=()=>{ muted=!muted; setMute(); };
  setMute();

  let idx=0, t=0, playing=false, last=0, ended=false, begun=false;
  const dur=()=>SLIDES[idx].d*1000;

  function setIcon(){ $('ppi').innerHTML = playing?PAUSE:PLAY; stage.classList.toggle('paused',!playing); }
  function setGal(i,k){
    const g=galEls[i]; if(!g||k===galCur) return; galCur=k;
    g.forEach((e,j)=>{ if(j===k){ e.classList.remove('on'); void e.offsetWidth; e.classList.add('on'); } else e.classList.remove('on'); });
  }
  let shown=false, outT;
  function showSlide(i){
    const from=idx; idx=i; t=0; audio.volume=BASEVOL;
    const animate=shown && from!==i && !rest;
    const tr=TR[i%TR.length];
    stage.dataset.dir = i>=from?'1':'-1';
    stage.style.setProperty('--dir', i>=from?'1':'-1');
    clearTimeout(outT);
    slideEls.forEach((el,k)=>{
      if(k===i){
        el.classList.remove('on','out'); void el.offsetWidth;
        if(animate) el.dataset.tr=tr; else delete el.dataset.tr;
        el.classList.add('on');
      } else if(animate && k===from){
        el.classList.remove('on'); el.dataset.tr=tr; el.classList.add('out');
      } else el.classList.remove('on','out');
    });
    if(animate){ outT=setTimeout(()=>{ slideEls[from].classList.remove('out'); },1300); }
    shown=true;
    cnEl.textContent=String(i+1).padStart(2,'0'); cnEl.classList.remove('flip'); void cnEl.offsetWidth; cnEl.classList.add('flip');
    if(animate){ sweepEl.classList.remove('go'); void sweepEl.offsetWidth; sweepEl.classList.add('go'); }
    galCur=-1; if(galEls[i]) setGal(i,0);
    segFills.forEach((f,k)=>{ f.style.width = k<i?'100%':'0%'; });
    thumbEls.forEach((b,k)=>{ if(k===i) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
    const b=thumbEls[i]; try{ thumbs.scrollTo({left:b.offsetLeft-thumbs.clientWidth/2+b.offsetWidth/2,behavior:'smooth'}); }catch(e){}
    updateTime();
  }
  function updateTime(){
    let before=0; for(let k=0;k<idx;k++) before+=SLIDES[k].d*1000;
    $('time').textContent = fmt(before+t)+' / '+fmt(total);
  }
  function go(i){
    i=Math.max(0,Math.min(SLIDES.length-1,i));
    ended=false; $('cover').hidden=true;
    if(rest){ rest=false; stage.classList.remove('rest'); }
    showSlide(i);
    if(!playing){ play(); } else { syncAudio(); }
  }
  function play(){
    if(ended){ ended=false; showSlide(0); }
    if(rest){ rest=false; stage.classList.remove('rest'); showSlide(idx); }
    playing=true; begun=true; $('cover').hidden=true; last=performance.now(); setIcon();
    audio.volume=BASEVOL; syncAudio(); if(audioReady||audio.readyState>=3) audioPlay(); else audioPlay();
  }
  function pause(){ playing=false; setIcon(); try{ audio.pause(); }catch(e){} }
  function finish(){
    playing=false; ended=true; setIcon(); try{ audio.pause(); }catch(e){}
    $('covt').textContent='إعادة العرض'; $('covs').textContent='';
    $('bigplay').setAttribute('aria-label','إعادة العرض'); $('cover').hidden=false;
    segFills[idx].style.width='100%';
  }
  function tick(ts){
    if(playing){
      t+=ts-last;
      if(t>=dur()){
        if(idx<SLIDES.length-1){ showSlide(idx+1); if(Math.abs(audio.currentTime-wantPos())>0.7) syncAudio(); }
        else { t=dur(); finish(); }
      } else {
        segFills[idx].style.width=(t/dur()*100)+'%'; updateTime();
        if(galEls[idx]){ const n=galEls[idx].length; setGal(idx,Math.min(n-1,Math.floor(t/(dur()/n)))); }
        if(idx===SLIDES.length-1){ const rem=dur()-t; audio.volume=BASEVOL*Math.max(0,Math.min(1,rem/2500)); }
      }
    }
    last=ts; requestAnimationFrame(tick);
  }

  $('ctot').textContent='/ '+String(SLIDES.length).padStart(2,'0');
  $('covs').textContent = SLIDES.length+' شريحة · '+fmt(total);
  $('bigplay').onclick=()=>{ if(ended){ showSlide(0); } play(); };
  $('pp').onclick=()=>{ if(playing) pause(); else play(); };
  $('prev').onclick=()=>go(t>2500?idx:idx-1);
  $('next').onclick=()=>go(idx+1);
  stage.addEventListener('click',e=>{ if(e.target.closest('.ui')||e.target.closest('.cover')) return; if(playing) pause(); else play(); });

  const fsBtn=$('fs');
  if(!stage.requestFullscreen){ fsBtn.hidden=true; }
  fsBtn.onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen().catch(()=>{}); }catch(e){} };

  document.addEventListener('keydown',e=>{
    if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
    if(e.key===' '){ e.preventDefault(); if(playing) pause(); else play(); }
    else if(e.key==='ArrowLeft'){ go(idx+1); }
    else if(e.key==='ArrowRight'){ go(idx-1); }
  });

  let idleT; const wake=()=>{ stage.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>stage.classList.add('idle'),2600); };
  ['pointermove','pointerdown','keydown'].forEach(ev=>stage.addEventListener(ev,wake)); wake();

  showSlide(0); setIcon(); $('cover').hidden=false;
  requestAnimationFrame(ts=>{ last=ts; requestAnimationFrame(tick); });
})();
</script>

</body></html>
